name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci-build.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_build_placeholder_123456
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar tipos
        run: npm run lint
      - name: Ejecutar pruebas
        run: npm test
      - name: Crear build
        run: npm run build
