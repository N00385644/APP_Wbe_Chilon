name: Supabase availability

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: supabase-availability
  cancel-in-progress: false

jobs:
  database-read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Comprobar una lectura real del catálogo público
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_PUBLISHABLE_KEY" || {
            echo 'Falta configurar las variables públicas SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY.'
            exit 1
          }
          curl --fail --silent --show-error --retry 2 --retry-delay 5 \
            --connect-timeout 10 --max-time 25 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H 'Accept: application/json' \
            "${SUPABASE_URL%/}/rest/v1/tours?select=id&is_published=eq.true&limit=1" \
            -o "$RUNNER_TEMP/supabase-check.json"
          node -e 'const fs = require("node:fs"); const path = require("node:path"); const data = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "supabase-check.json"), "utf8")); if (!Array.isArray(data)) throw new Error("Respuesta de catálogo inválida"); console.log("Supabase respondió correctamente a la consulta de base de datos.");'
